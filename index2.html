<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kesar | AI Engineer</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* 🎥 AI BACKGROUND */
video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-1;
filter:brightness(0.3);
}

/* HERO */

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

/* 🧬 HOLOGRAM IMAGE */

.holo{
width:200px;
border-radius:50%;
border:3px solid cyan;
box-shadow:0 0 40px cyan;
animation:scan 3s infinite linear;
}

@keyframes scan{
0%{box-shadow:0 0 10px cyan;}
50%{box-shadow:0 0 40px blue;}
100%{box-shadow:0 0 10px cyan;}
}

/* 🧠 NAME */

h1{
font-size:3rem;
letter-spacing:5px;
background:linear-gradient(to right,cyan,blue);
-webkit-background-clip:text;
color:transparent;
}

/* THINKING DOTS */

.thinking::after{
content:'';
animation:dots 2s infinite;
}

@keyframes dots{
0%{content:'';}
33%{content:'.';}
66%{content:'..';}
100%{content:'...';}
}

/* 🌐 LINKS */

.links a{
color:cyan;
margin:10px;
font-size:20px;
text-decoration:none;
border:1px solid cyan;
padding:10px 20px;
border-radius:30px;
transition:0.3s;
}

.links a:hover{
background:cyan;
color:black;
box-shadow:0 0 20px cyan;
}

/* ⚡ SKILLS HUD */

.skills{
padding:100px 20px;
text-align:center;
}

.skill{
margin:20px auto;
width:80%;
border:1px solid cyan;
padding:10px;
position:relative;
}

.skill::before{
content:'';
position:absolute;
top:0;
left:0;
height:100%;
width:var(--level);
background:linear-gradient(to right,cyan,blue);
animation:load 2s;
}

@keyframes load{
from{width:0;}
to{width:var(--level);}
}

</style>
</head>

<body>

<!-- 🎥 BACKGROUND VIDEO -->
<video autoplay muted loop>
<source src="https://cdn.coverr.co/videos/coverr-robotic-arm-technology-5176/1080p.mp4">
</video>

<section class="hero">

<img src="your-photo.jpg" class="holo">

<h1>KESAR</h1>

<h3>AI SYSTEM INITIALIZING<span class="thinking"></span></h3>

<div class="links">
<a href="#">GitHub</a>
<a href="#">LinkedIn</a>
<a href="#">Instagram</a>
</div>

</section>

<section class="skills">

<h2>⚡ CORE SYSTEM</h2>

<div class="skill" style="--level:90%">HTML</div>
<div class="skill" style="--level:85%">CSS</div>
<div class="skill" style="--level:75%">JavaScript</div>
<div class="skill" style="--level:70%">Python</div>

</section>

</body>
</html>
